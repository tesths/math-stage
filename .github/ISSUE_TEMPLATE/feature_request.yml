name: ✨ 功能建议 / Feature request
description: 提议新增 Lab、小游戏、年级或改进现有体验
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法！请尽量说明它解决什么教学问题。
        Please describe the teaching problem it solves.

  - type: textarea
    id: problem
    attributes:
      label: 背景 / 要解决的问题
      description: 这个建议对应哪一课、哪类学生痛点？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      placeholder: 例如：为三年级「24 时记时法」增加可拖动的钟面，显示时间段。
    validations:
      required: true

  - type: dropdown
    id: grade
    attributes:
      label: 相关年级 / Grade
      options:
        - 门户 portal
        - 一年级 g1
        - 二年级 g2
        - 三年级 g3
        - 四年级 g4
        - 五年级 g5
        - 六年级 g6
        - 通用 / 跨年级

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考 / Alternatives or references
      description: 其他平台怎么做的？有没有参考资料？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
